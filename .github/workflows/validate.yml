name: validate

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Issue forms are valid (GitHub hides invalid ones silently)
        run: python3 scripts/check-issue-forms.py

      - name: Schema + sanity checks
        run: node scripts/validate.mjs

      - name: Unit tests
        run: node --test

      - name: README and docs are generated from data
        run: |
          node scripts/build-readme.mjs
          if [ -n "$(git status --porcelain -- README.md docs)" ]; then
            echo "::error::README.md or docs/ is out of date. Run 'npm run build' and commit the result."
            git status --short -- README.md docs
            git --no-pager diff --stat -- README.md docs
            exit 1
          fi

      - name: Every source URL is well-formed
        run: |
          node -e '
            const d = JSON.parse(require("fs").readFileSync("data/providers.json","utf8"));
            const bad = [];
            for (const p of d.providers) for (const s of p.sources) { try { new URL(s.url); } catch { bad.push(p.id + ": " + s.url); } }
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("all source URLs parse");
          '
