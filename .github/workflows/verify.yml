name: verify

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/providers.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate dataset
        run: node scripts/validate.mjs

      - name: Run live probes
        env:
          # Keyless probes always run. Add any of these as repository secrets to cover keyed providers.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AION_API_KEY: ${{ secrets.AION_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/verify.mjs

      - name: Rebuild README and docs
        run: node scripts/build-readme.mjs

      - name: Commit status + badges
        run: |
          git config user.name "awesome-free-ai-apis bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json badges README.md docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(verify): daily live check $(date -u +%Y-%m-%d)"
            git push
          fi
