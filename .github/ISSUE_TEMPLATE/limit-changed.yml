name: "🔁 Limit changed / provider update"
description: A listed number is out of date, or a provider retired its free tier
labels: [update, needs-verification]
body:
  - type: input
    id: provider
    attributes: { label: Provider id (from data/providers.json), placeholder: "groq" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What changed?, placeholder: "RPD dropped from 1,000 to 500 on 2026-10-01…" }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Official source (page, changelog, email from the provider), placeholder: "https://…" }
  - type: textarea
    id: evidence
    attributes: { label: Other evidence (console screenshot, error message) }
