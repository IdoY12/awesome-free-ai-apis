<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Awesome Free AI APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPink"><stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <clipPath id="round"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1080" cy="60" r="260" fill="url(#glowCyan)"/>
    <circle cx="260" cy="310" r="240" fill="url(#glowPink)"/>

    <!-- network motif (right side) -->
    <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.55">
      <path d="M930 90 L1010 150 L1090 100 L1170 160 L1230 110"/>
      <path d="M950 230 L1010 150 L1080 220 L1170 160 L1210 250"/>
      <path d="M1010 150 L1080 220 M1090 100 L1080 220"/>
    </g>
    <g fill="#0b1020" stroke="url(#accent)" stroke-width="2">
      <circle cx="930" cy="90" r="6"/><circle cx="1010" cy="150" r="9"/><circle cx="1090" cy="100" r="6"/>
      <circle cx="1170" cy="160" r="9"/><circle cx="1230" cy="110" r="5"/><circle cx="950" cy="230" r="5"/>
      <circle cx="1080" cy="220" r="7"/><circle cx="1210" cy="250" r="5"/>
    </g>
    <g fill="#22d3ee"><circle cx="1010" cy="150" r="3.5"/><circle cx="1170" cy="160" r="3.5"/></g>

    <!-- badge pill -->
    <g transform="translate(64 62)">
      <rect width="230" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="15" r="5" fill="#22c55e"/>
      <circle cx="18" cy="15" r="9" fill="#22c55e" fill-opacity="0.25"/>
      <text x="34" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#d1d5db" letter-spacing="0.5">LIVE-CHECKED · DAILY</text>
    </g>

    <!-- title -->
    <text x="64" y="160" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Awesome Free</text>
    <text x="64" y="228" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">AI APIs</text>

    <!-- subtitle -->
    <text x="66" y="272" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#c7d2fe" fill-opacity="0.9">Permanent free tiers only · verified against official docs · the data-policy fine print, listed</text>

    <!-- category chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e5e7eb">
      <g transform="translate(640 110)">
        <rect width="70" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/><text x="35" y="16" text-anchor="middle">LLM</text>
      </g>
      <g transform="translate(718 110)">
        <rect width="84" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/><text x="42" y="16" text-anchor="middle">IMAGE</text>
      </g>
      <g transform="translate(810 110)">
        <rect width="90" height="24" rx="12" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/><text x="45" y="16" text-anchor="middle">SPEECH</text>
      </g>
      <g transform="translate(640 142)">
        <rect width="110" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/><text x="55" y="16" text-anchor="middle">EMBEDDINGS</text>
      </g>
      <g transform="translate(758 142)">
        <rect width="100" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/><text x="50" y="16" text-anchor="middle">VECTOR DB</text>
      </g>
      <g transform="translate(866 142)">
        <rect width="80" height="24" rx="12" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/><text x="40" y="16" text-anchor="middle">SEARCH</text>
      </g>
      <g transform="translate(640 174)">
        <rect width="64" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/><text x="32" y="16" text-anchor="middle">OCR</text>
      </g>
      <g transform="translate(712 174)">
        <rect width="120" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/><text x="60" y="16" text-anchor="middle">MODERATION</text>
      </g>
      <g transform="translate(840 174)">
        <rect width="120" height="24" rx="12" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/><text x="60" y="16" text-anchor="middle">TRANSLATION</text>
      </g>
    </g>

    <!-- bottom accent line -->
    <rect x="0" y="314" width="1280" height="6" fill="url(#accent)"/>
  </g>
</svg>
